name: Python CI Pipeline - Sistem Penilaian Praktikum

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Siapkan Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan unit test
        run: pytest -v --cov=config --cov=controllers --cov-report=term-missing

  build-exe:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instal dependensi dan PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bungkus menjadi .exe (ikon logo + splash beranimasi)
        run: pyinstaller --noconfirm --clean AplikasiPenilaianPraktikum.spec

      - name: Unggah hasil .exe
        uses: actions/upload-artifact@v4
        with:
          name: AplikasiPenilaianPraktikum
          path: dist/AplikasiPenilaianPraktikum.exe